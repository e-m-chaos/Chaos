[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imu-features"
version = "0.1.0"
description = "An extensible feature-engineering engine for IMU (accelerometer/gyroscope/magnetometer) signals"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
]

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
